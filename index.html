<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interaktiv 3D-modell</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#e9e5df}canvas{display:block}#panel{position:fixed;top:12px;left:12px;z-index:2;background:#ffffffed;border:1px solid #d8d0c6;border-radius:12px;padding:12px 14px;max-width:320px;box-shadow:0 4px 18px #0001}h1{font-size:15px;margin:0 0 5px}p{font-size:12px;line-height:1.4;margin:0 0 9px;color:#5e574f}.buttons{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #cfc5b9;background:#f7f3ed;border-radius:7px;padding:7px 9px;font-size:12px}#status{font-size:11px;margin-top:8px;color:#675f56}#error{display:none;position:fixed;bottom:12px;left:12px;right:12px;background:#fff0ef;border:1px solid #c66;border-radius:8px;padding:12px;z-index:4;font-size:13px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<div id="panel"><h1>Interaktiv 3D-modell · 5,0 × 4,0 × 2,7 m</h1><p>Dra för att rotera. Scrolla/nyp för att zooma. Högerklicka och dra för att flytta vyn.</p><div class="buttons"><button id="home">Startvy</button><button id="top">Ovanifrån</button><button id="sofa">Från soffan</button><button id="walls">Visa/dölj väggar</button></div><div id="status">Laddar 3D-motorn …</div></div><div id="error"></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const err=document.querySelector('#error'),status=document.querySelector('#status');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color('#e9e5df');
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(6.5,4.8,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=2.3;controls.maxDistance=15;
scene.add(new THREE.HemisphereLight(0xffffff,0x8e7964,2));const sun=new THREE.DirectionalLight(0xfff0dc,3);sun.position.set(-3,7,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={wall:mat('#e2d9ce'),side:mat('#d1c5b5'),accent:mat('#b9ab98'),floor:mat('#b88655'),wood:mat('#805333'),wood2:mat('#b48a5c'),rose:mat('#ce929b'),pink:mat('#ddaab0'),cream:mat('#e9dfcf'),rug:mat('#ded3c1'),black:mat('#111317',.2,.1),glass:new THREE.MeshPhysicalMaterial({color:'#9cc9e3',roughness:.16,transparent:true,opacity:.7}),white:mat('#f3efe8'),green:mat('#647a50'),terra:mat('#b87550'),metal:mat('#988b7a',.3,.5)};
const walls=new THREE.Group();scene.add(walls);const f=new THREE.Group();scene.add(f);const room=new THREE.Group();scene.add(room);
function box(w,h,d,x,y,z,m,p=f){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function cyl(rt,rb,h,x,y,z,m,p=f,n=32){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o}
function rod(a,b,r,m,p=f){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),12),m);o.position.copy(A).add(B).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());o.castShadow=true;p.add(o);return o}
// Room: 5 m wide, 4 m deep, 2.7 m high; front wall omitted for a clear interior view.
box(5,.08,4,0,-.04,0,M.floor,room);box(5,2.7,.12,0,1.35,-2,M.wall,walls);box(.12,2.7,4,-2.5,1.35,0,M.side,walls);box(.12,2.7,4,2.5,1.35,0,M.side,walls);
box(2.35,2.35,.025,0,1.4,-1.925,M.accent,walls);
function winBack(x,w){box(w,1.7,.035,x,1.57,-1.91,M.glass,walls);for(const xx of [x-w/2,x,x+w/2])box(.04,1.78,.06,xx,1.57,-1.87,M.white,walls);for(const y of [.72,2.42])box(w+.04,.04,.06,x,y,-1.87,M.white,walls)}
winBack(-1.42,1.55);winBack(.42,1.55);
box(.035,1.7,2.6,-2.41,1.57,.15,M.glass,walls);for(const z of [-1.15,.15,1.45])box(.06,1.78,.04,-2.37,1.57,z,M.white,walls);for(const y of [.72,2.42])box(.06,.04,2.65,-2.37,y,.15,M.white,walls);
box(.18,.55,1.4,-2.32,.34,-.25,M.white,walls);box(1.35,.55,.16,-.65,.34,-1.82,M.white,walls);
// Door on right-hand wall, opposite the window side
box(.035,2.08,.88,2.43,1.04,.95,mat('#715b4b'),walls);box(.06,2.16,.05,2.38,1.08,.49,M.white,walls);box(.06,2.16,.05,2.38,1.08,1.41,M.white,walls);box(.06,.05,1,2.38,2.15,.95,M.white,walls);
// Herringbone-style floor strips
for(let row=0;row<25;row++)for(let col=0;col<18;col++){let x=-2.38+col*.28,z=-1.9+row*.16,flip=(row+col)%2===0;let o=box(flip?.265:.15,.012,flip?.15:.265,x,-.002,z,(row+col)%3?M.wood2:M.floor,room);o.material=(row+col)%3?mat('#c29462'):mat('#b6814e');o.rotation.y=flip?0:Math.PI/2}
box(3.35,.035,2.35,-.05,.025,.35,M.rug);box(3.28,.008,2.28,-.05,.045,.35,mat('#eee5d8'));
// Pink 3-seat sofa, back toward viewer and facing TV
box(2.35,.25,.78,0,.47,1.15,M.rose);box(2.35,.72,.22,0,.88,1.48,M.rose);box(.2,.48,.78,-1.075,.62,1.15,M.rose);box(.2,.48,.78,1.075,.62,1.15,M.rose);
for(const x of [-.72,0,.72])box(.7,.1,.63,x,.63,1.05,M.pink);for(const x of [-.76,.76])box(.55,.36,.15,x,1,1.31,M.pink);for(const x of [-.98,.98])for(const z of [.88,1.42])box(.06,.22,.06,x,.12,z,M.wood);
// Wall-mounted TV
box(1.55,.88,.07,0,1.75,-1.82,M.black);box(1.46,.79,.012,0,1.75,-1.775,mat('#171a20',.16));
// lounge chair + footstool left
box(.78,.16,.68,-1.68,.57,.28,M.cream);let back=box(.76,.82,.16,-1.68,.94,.01,M.cream);back.rotation.x=-.12;back.rotation.y=-.12;
for(const x of [-2.1,-1.26]){rod([x,.62,.03],[x,.79,.53],.045,M.wood);rod([x,.06,.04],[x,.52,.08],.035,M.wood);rod([x,.06,.52],[x,.52,.48],.035,M.wood)}
box(.72,.15,.55,-1.2,.32,.98,M.cream);for(const x of [-1.48,-.92])for(const z of [.78,1.18])rod([x,.04,z],[x,.25,z],.03,M.wood);
cyl(.25,.25,.07,-2.08,.48,1.12,M.wood2);cyl(.055,.075,.43,-2.08,.24,1.12,M.wood);rod([-2.12,.05,-.25],[-2.12,1.75,-.25],.018,M.metal);cyl(.23,.31,.2,-2.12,1.77,-.25,M.cream);
// Small round dining table and chairs on right
cyl(.53,.53,.09,1.62,.83,-.45,M.wood2,f,48);cyl(.14,.19,.74,1.62,.42,-.45,M.wood);
for(const [x,z] of [[.95,-.45],[1.62,.23],[2.12,-.45]]){box(.42,.11,.4,x,.47,z,M.cream);box(.42,.48,.09,x,.73,z-.18,M.cream);for(const dx of [-.15,.15])for(const dz of [-.13,.13])rod([x+dx,.04,z+dz],[x+dx,.42,z+dz],.022,M.wood)}
cyl(.095,.12,.15,1.62,.95,-.45,mat('#9b8b77'));for(let i=0;i<6;i++){let a=i*Math.PI/3;rod([1.62,.99,-.45],[1.62+Math.cos(a)*.16,1.22+(i%2)*.04,-.45+Math.sin(a)*.16],.014,M.green)}
rod([1.62,2.68,-.45],[1.62,2.18,-.45],.009,M.black);cyl(.25,.15,.16,1.62,2.13,-.45,M.terra);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat('#e9e5df'));ground.rotation.x=-Math.PI/2;ground.position.y=-.14;ground.receiveShadow=true;scene.add(ground);
const home=()=>{camera.position.set(6.5,4.8,7);controls.target.set(0,1,0);controls.update()};document.querySelector('#home').onclick=home;document.querySelector('#top').onclick=()=>{camera.position.set(.1,9,.1);controls.target.set(0,0,0);controls.update()};document.querySelector('#sofa').onclick=()=>{camera.position.set(0,2.4,3.8);controls.target.set(0,1,-.5);controls.update()};let visible=true;document.querySelector('#walls').onclick=()=>{visible=!visible;walls.visible=visible};
status.textContent='3D-modellen är laddad.';
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){console.error(e);err.style.display='block';err.textContent='3D-modellen kunde inte starta. Kontrollera internetanslutningen och öppna via en lokal webbserver, till exempel VS Code + Live Server. Fel: '+e.message;status.textContent='Kunde inte ladda 3D-modellen.'}
</script></body></html>
