<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interaktiv 3D-modell</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#e9e5df}canvas{display:block}#panel{position:fixed;top:10px;left:10px;z-index:2;background:#ffffffed;border:1px solid #d8d0c6;border-radius:12px;padding:11px 12px;width:min(330px,calc(100vw - 46px));max-height:calc(100dvh - 44px);overflow:auto;box-shadow:0 4px 18px #0001}details{margin-top:9px;border-top:1px solid #ddd4ca;padding-top:7px}summary{font-size:13px;font-weight:650;cursor:pointer}label{display:grid;grid-template-columns:1fr 70px;gap:5px;align-items:center;font-size:12px;margin:8px 0}input[type=range]{grid-column:1 / -1;width:100%;margin:0}output{font-variant-numeric:tabular-nums;text-align:right;color:#655b52}h1{font-size:15px;margin:0 0 5px}p{font-size:12px;line-height:1.4;margin:0 0 9px;color:#5e574f}.buttons{display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid #cfc5b9;background:#f7f3ed;border-radius:7px;padding:7px 9px;font-size:12px}#status{font-size:11px;margin-top:8px;color:#675f56}#error{display:none;position:fixed;bottom:12px;left:12px;right:12px;background:#fff0ef;border:1px solid #c66;border-radius:8px;padding:12px;z-index:4;font-size:13px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<div id="panel"><h1>3D-visning · 5,0 × 4,0 × 2,7 m</h1><p>Dra för att gå runt rummet. Nyp för att zooma. Möbler med mjukare former, dagsljus och stadsvy.</p><div class="buttons"><button id="home">Startvy</button><button id="top">Ovanifrån</button><button id="sofa">Från soffan</button><button id="walls">Visa/dölj väggar</button></div>
<details open><summary>Rummets mått</summary>
<label>Längd (m)<output id="wout">5,0</output><input id="rw" type="range" min="3" max="8" step="0.1" value="5"></label>
<label>Djup (m)<output id="dout">4,0</output><input id="rd" type="range" min="2.5" max="7" step="0.1" value="4"></label>
<label>Höjd (m)<output id="hout">2,7</output><input id="rh" type="range" min="2.2" max="3.5" step="0.1" value="2.7"></label>
</details>
<details open><summary>Flytta möbler</summary>
<label>Soffa – vänster/höger<output id="sxout">0,0</output><input id="sx" type="range" min="-1.5" max="1.5" step="0.05" value="0"></label>
<label>Soffa – fram/bak<output id="szout">1,2</output><input id="sz" type="range" min="0" max="1.8" step="0.05" value="1.15"></label>
<label>Fåtölj – vänster/höger<output id="cxout">-1,7</output><input id="cx" type="range" min="-2.2" max="-0.5" step="0.05" value="-1.68"></label>
<label>Matbord – vänster/höger<output id="txout">1,6</output><input id="tx" type="range" min="0.5" max="2.1" step="0.05" value="1.62"></label>
<label>Soffans bredd <output id="swout">1,0×</output><input id="sw" type="range" min="0.75" max="1.3" step="0.05" value="1"></label>
<label>Soffans djup <output id="sdout">1,0×</output><input id="sd" type="range" min="0.75" max="1.3" step="0.05" value="1"></label>
</details>
<details open><summary>Öppen spis</summary>
<label>Bredd (m)<output id="fbout">1,2</output><input id="fb" type="range" min="0.8" max="1.8" step="0.05" value="1.2"></label>
<label>Höjd (m)<output id="fhout">1,9</output><input id="fh" type="range" min="1.3" max="2.4" step="0.05" value="1.9"></label>
<label>Färg på puts <input id="fireColor" type="color" value="#f2eee8"></label>
</details>
<details><summary>Färger på möbler</summary>
<label>Soffa <input id="sofaColor" type="color" value="#ce929b"></label>
<label>Fåtölj <input id="chairColor" type="color" value="#e9dfcf"></label>
<label>Matbord <input id="tableColor" type="color" value="#b48a5c"></label>
</details><div id="status">Laddar 3D-motorn …</div></div><div id="error"></div>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
const err=document.querySelector('#error'),status=document.querySelector('#status');
try{
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9e5ed');
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(6.5,4.8,7);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.49;controls.minDistance=2.3;controls.maxDistance=15;
scene.add(new THREE.HemisphereLight(0xffffff,0x8e7964,2.15));const fillLight=new THREE.DirectionalLight(0xfff5e8,1.1);fillLight.position.set(3,4,4);scene.add(fillLight);const sun=new THREE.DirectionalLight(0xfff0dc,3.2);sun.position.set(-3,7,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const M={wall:mat('#e2d9ce'),side:mat('#d1c5b5'),accent:mat('#b9ab98'),floor:mat('#b88655'),wood:mat('#805333'),wood2:mat('#b48a5c'),rose:mat('#ce929b'),pink:mat('#ddaab0'),cream:mat('#e9dfcf'),rug:mat('#ded3c1'),black:mat('#111317',.2,.1),glass:new THREE.MeshPhysicalMaterial({color:'#9cc9e3',roughness:.16,transparent:true,opacity:.7}),white:mat('#f3efe8'),green:mat('#647a50'),terra:mat('#b87550'),metal:mat('#988b7a',.3,.5)};
const walls=new THREE.Group();scene.add(walls);const f=new THREE.Group();scene.add(f);const room=new THREE.Group();scene.add(room);const sofaGroup=new THREE.Group();f.add(sofaGroup);const chairGroup=new THREE.Group();f.add(chairGroup);const tableGroup=new THREE.Group();f.add(tableGroup);const fireplaceGroup=new THREE.Group();f.add(fireplaceGroup);
function box(w,h,d,x,y,z,m,p=f){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function softBox(w,h,d,x,y,z,r,m,p=f){const o=new THREE.Mesh(new RoundedBoxGeometry(w,h,d,5,Math.min(r,w*.45,h*.45,d*.45)),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;p.add(o);return o}
function cyl(rt,rb,h,x,y,z,m,p=f,n=32){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),m);o.position.set(x,y,z);o.castShadow=true;p.add(o);return o}
function rod(a,b,r,m,p=f){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A),o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),12),m);o.position.copy(A).add(B).multiplyScalar(.5);o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());o.castShadow=true;p.add(o);return o}
// Room: 5 m wide, 4 m deep, 2.7 m high; front wall omitted for a clear interior view.
box(5,.08,4,0,-.04,0,M.floor,room);// Back wall split around the two windows so the exterior view is visible
box(5,.28,.12,0,2.56,-2,M.wall,walls);
box(5,.72,.12,0,.36,-2,M.wall,walls);
box(.305,1.7,.12,-2.3475,1.57,-2,M.wall,walls);
box(.29,1.7,.12,-.5,1.57,-2,M.wall,walls);
box(1.305,1.7,.12,1.8475,1.57,-2,M.wall,walls);box(.12,2.7,4,-2.5,1.35,0,M.side,walls);box(.12,2.7,4,2.5,1.35,0,M.side,walls);
box(2.35,2.35,.025,0,1.4,-1.925,M.accent,walls);
function winBack(x,w){box(w,1.7,.035,x,1.57,-1.91,M.glass,walls);for(const xx of [x-w/2,x,x+w/2])box(.04,1.78,.06,xx,1.57,-1.87,M.white,walls);for(const y of [.72,2.42])box(w+.04,.04,.06,x,y,-1.87,M.white,walls)}
winBack(-1.42,1.55);winBack(.42,1.55);
// Distant skyline, treetops and soft daylight visible through the rear windows
const outdoor=new THREE.Group();scene.add(outdoor);
const skyMat=new THREE.MeshBasicMaterial({color:'#b9d6e8'});box(8,4,.04,0,1.7,-2.52,skyMat,outdoor);
const cityMats=['#a9b7bd','#c3c6c2','#8f9fa8','#d1c9bb'].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));
for(let i=0;i<30;i++){const bw=.12+(i%4)*.075,bh=.28+(i*7%11)*.055;box(bw,bh,.12,-2.9+i*.20,.42+bh/2,-2.42,cityMats[i%cityMats.length],outdoor);}
const greenM=mat('#657d5d',1);
for(let i=0;i<22;i++){const x=-2.8+i*.26; cyl(.10,.18,.45,x,.38,-2.35,greenM,outdoor,10);}

box(.035,1.7,2.6,-2.41,1.57,.15,M.glass,walls);for(const z of [-1.15,.15,1.45])box(.06,1.78,.04,-2.37,1.57,z,M.white,walls);for(const y of [.72,2.42])box(.06,.04,2.65,-2.37,y,.15,M.white,walls);
box(.18,.55,1.4,-2.32,.34,-.25,M.white,walls);box(1.35,.55,.16,-.65,.34,-1.82,M.white,walls);
// Door on right-hand wall, opposite the window side
box(.035,2.08,.88,2.43,1.04,.95,mat('#715b4b'),walls);box(.06,2.16,.05,2.38,1.08,.49,M.white,walls);box(.06,2.16,.05,2.38,1.08,1.41,M.white,walls);box(.06,.05,1,2.38,2.15,.95,M.white,walls);
// Herringbone-style floor strips
for(let row=0;row<25;row++)for(let col=0;col<18;col++){let x=-2.38+col*.28,z=-1.9+row*.16,flip=(row+col)%2===0;let o=box(flip?.265:.15,.012,flip?.15:.265,x,-.002,z,(row+col)%3?M.wood2:M.floor,room);o.material=(row+col)%3?M.wood2:M.floor;o.rotation.y=flip?0:Math.PI/2}
box(3.35,.035,2.35,-.05,.025,.35,M.rug);box(3.28,.008,2.28,-.05,.045,.35,mat('#eee5d8'));
// Pink 3-seat sofa, back toward viewer and facing TV
softBox(2.36,.30,.82,0,.46,1.15,.12,M.rose,sofaGroup);
softBox(2.34,.67,.25,0,.82,1.48,.11,M.rose,sofaGroup);
softBox(.25,.48,.82,-1.055,.60,1.15,.10,M.rose,sofaGroup);
softBox(.25,.48,.82,1.055,.60,1.15,.10,M.rose,sofaGroup);
for(const x of [-.72,0,.72])softBox(.71,.14,.63,x,.63,1.04,.065,M.pink,sofaGroup);
for(const x of [-.76,.76]){const pillow=softBox(.53,.32,.17,x,.99,1.30,.075,M.pink,sofaGroup);pillow.rotation.z=x<0?-.08:.08;}for(const x of [-.98,.98])for(const z of [.88,1.42])box(.06,.22,.06,x,.12,z,M.wood,sofaGroup);
// Open fireplace tucked into the front-right corner on the right-hand side wall.
// The opening faces into the room; dimensions and plaster color are adjustable in the panel.
const firePlaster=mat('#f2eee8'), brick=mat('#755448'), brick2=mat('#986d5b'), hearthMat=mat('#9b7568'), fireMetal=mat('#292725',.35,.55), logMat=mat('#8b6546');
const fpBaseX=1.88, fpZ=1.25;
function buildFireplace(){
 while(fireplaceGroup.children.length) fireplaceGroup.remove(fireplaceGroup.children[0]);
 const w=Number(document.getElementById('fb')?.value||1.2), h=Number(document.getElementById('fh')?.value||1.9);
 const plaster=firePlaster; plaster.color.set(document.getElementById('fireColor')?.value||'#f2eee8');
 // chimney breast / white plastered surround attached to right wall
 box(.48,h,w,2.16,h/2,fpZ,plaster,fireplaceGroup);
 // dark recessed opening on the room-facing (left) face
 box(.025,h*.43,w*.62,1.91,h*.46,fpZ,mat('#211b19'),fireplaceGroup);
 // visible brick lining and hearth
 for(let row=0;row<4;row++) for(let col=0;col<4;col++) box(.035,.13,w*.13,1.885,.30+row*.15,fpZ-w*.24+col*w*.16,(row+col)%2?brick:brick2,fireplaceGroup);
 box(.52,.13,w*1.12,2.04,.08,fpZ,hearthMat,fireplaceGroup);
 // logs, metal upright and lintel
 rod([1.82,.20,fpZ-.19],[1.82,.48,fpZ+.12],.045,logMat,fireplaceGroup);
 rod([1.83,.20,fpZ+.18],[1.83,.44,fpZ-.10],.045,logMat,fireplaceGroup);
 rod([1.80,.55,fpZ+w*.30],[1.80,.10,fpZ+w*.30],.025,fireMetal,fireplaceGroup);
 box(.05,.035,w*.8,1.88,h*.72,fpZ,fireMetal,fireplaceGroup);
 const flameMat=new THREE.MeshStandardMaterial({color:'#ff8b24',emissive:'#ff4d00',emissiveIntensity:1.6,roughness:.45,transparent:true,opacity:.92});
 for(let i=0;i<3;i++){const flame=new THREE.Mesh(new THREE.ConeGeometry(.09+i*.015,.40+i*.08,9),flameMat);flame.position.set(1.84,.48+i*.035,fpZ-.13+i*.13);flame.rotation.z=-.08+i*.08;flame.castShadow=false;fireplaceGroup.add(flame)}
 const glow=new THREE.PointLight(0xff7a24,1.2,2.2);glow.position.set(1.62,.55,fpZ);fireplaceGroup.add(glow);
}
// Wall-mounted TV
box(1.55,.88,.07,0,1.75,-1.82,M.black);box(1.46,.79,.012,0,1.75,-1.775,mat('#171a20',.16));
// lounge chair + footstool left
softBox(.78,.18,.68,-1.68,.57,.28,.08,M.cream,chairGroup);let back=softBox(.76,.82,.19,-1.68,.94,.01,.09,M.cream,chairGroup);back.rotation.x=-.12;back.rotation.y=-.12;
for(const x of [-2.1,-1.26]){rod([x,.62,.03],[x,.79,.53],.045,M.wood,chairGroup);rod([x,.06,.04],[x,.52,.08],.035,M.wood,chairGroup);rod([x,.06,.52],[x,.52,.48],.035,M.wood)}
softBox(.72,.18,.55,-1.2,.32,.98,.08,M.cream,chairGroup);for(const x of [-1.48,-.92])for(const z of [.78,1.18])rod([x,.04,z],[x,.25,z],.03,M.wood,chairGroup);
cyl(.25,.25,.07,-2.08,.48,1.12,M.wood2,chairGroup);cyl(.055,.075,.43,-2.08,.24,1.12,M.wood,chairGroup);rod([-2.12,.05,-.25],[-2.12,1.75,-.25],.018,M.metal,chairGroup);cyl(.23,.31,.2,-2.12,1.77,-.25,M.cream,chairGroup);
// Small round dining table and chairs on right
cyl(.53,.53,.09,1.62,.83,-.45,M.wood2,tableGroup,48);cyl(.14,.19,.74,1.62,.42,-.45,M.wood,tableGroup);
for(const [x,z] of [[.95,-.45],[1.62,.23],[2.12,-.45]]){box(.42,.11,.4,x,.47,z,M.cream,tableGroup);box(.42,.48,.09,x,.73,z-.18,M.cream,tableGroup);for(const dx of [-.15,.15])for(const dz of [-.13,.13])rod([x+dx,.04,z+dz],[x+dx,.42,z+dz],.022,M.wood,tableGroup)}
cyl(.095,.12,.15,1.62,.95,-.45,mat('#9b8b77'));for(let i=0;i<6;i++){let a=i*Math.PI/3;rod([1.62,.99,-.45],[1.62+Math.cos(a)*.16,1.22+(i%2)*.04,-.45+Math.sin(a)*.16],.014,M.green)}
rod([1.62,2.68,-.45],[1.62,2.18,-.45],.009,M.black);cyl(.25,.15,.16,1.62,2.13,-.45,M.terra);
buildFireplace();
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100),mat('#e9e5df'));ground.rotation.x=-Math.PI/2;ground.position.y=-.14;ground.receiveShadow=true;scene.add(ground);
const home=()=>{camera.position.set(6.5,4.8,7);controls.target.set(0,1,0);controls.update()};document.querySelector('#home').onclick=home;document.querySelector('#top').onclick=()=>{camera.position.set(.1,9,.1);controls.target.set(0,0,0);controls.update()};document.querySelector('#sofa').onclick=()=>{camera.position.set(0,2.4,3.8);controls.target.set(0,1,-.5);controls.update()};let visible=true;document.querySelector('#walls').onclick=()=>{visible=!visible;walls.visible=visible};

const fmt=v=>Number(v).toLocaleString('sv-SE',{minimumFractionDigits:1,maximumFractionDigits:2});
function bindRange(id,out,fn){const el=document.getElementById(id),o=document.getElementById(out);const update=()=>{o.textContent=fmt(el.value);fn(Number(el.value))};el.addEventListener('input',update);update()}
bindRange('rw','wout',v=>{room.scale.x=v/5;walls.scale.x=v/5;document.querySelector('h1').textContent=`3D-visning · ${fmt(v)} × ${fmt(document.getElementById('rd').value)} × ${fmt(document.getElementById('rh').value)} m`});
bindRange('rd','dout',v=>{room.scale.z=v/4;walls.scale.z=v/4;document.querySelector('h1').textContent=`Interaktiv 3D-modell · ${fmt(document.getElementById('rw').value)} × ${fmt(v)} × ${fmt(document.getElementById('rh').value)} m`});
bindRange('rh','hout',v=>{walls.scale.y=v/2.7;document.querySelector('h1').textContent=`Interaktiv 3D-modell · ${fmt(document.getElementById('rw').value)} × ${fmt(document.getElementById('rd').value)} × ${fmt(v)} m`});
bindRange('sw','swout',v=>{sofaGroup.scale.x=v});bindRange('sd','sdout',v=>{sofaGroup.scale.z=v});
bindRange('fb','fbout',v=>buildFireplace());bindRange('fh','fhout',v=>buildFireplace());
document.querySelector('#sofaColor').addEventListener('input',e=>{M.rose.color.set(e.target.value);M.pink.color.set(e.target.value).lerp(new THREE.Color('#ffffff'),.22)});document.querySelector('#chairColor').addEventListener('input',e=>M.cream.color.set(e.target.value));document.querySelector('#tableColor').addEventListener('input',e=>M.wood2.color.set(e.target.value));
bindRange('sx','sxout',v=>sofaGroup.position.x=v);bindRange('sz','szout',v=>sofaGroup.position.z=v-1.15);bindRange('cx','cxout',v=>chairGroup.position.x=v+1.68);bindRange('tx','txout',v=>tableGroup.position.x=v-1.62);
status.textContent='3D-modellen är laddad.';
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
}catch(e){console.error(e);err.style.display='block';err.textContent='3D-modellen kunde inte starta. Kontrollera internetanslutningen och öppna via en lokal webbserver, till exempel VS Code + Live Server. Fel: '+e.message;status.textContent='Kunde inte ladda 3D-modellen.'}
</script></body></html>
